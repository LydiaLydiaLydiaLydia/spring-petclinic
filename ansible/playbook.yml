- name: Configure PetClinic Application Environment
  hosts: test_servers
  become: yes
  
  tasks:
    - name: Ensure application directory exists
      file:
        path: "/var/jenkins_home/petclinic"
        state: directory
        owner: "jenkins"
        mode: '0755'
        
    - name: Create logs directory
      file:
        path: "/var/jenkins_home/logs"
        state: directory
        owner: "jenkins"
        mode: '0755'

    - name : Ensure Docker is installed
      package:
        name: docker.io
        state: present
      when: inventory_hostname != 'localhost'

    - name: Ensure Docker service is running
      service: 
        name: docker
        state: started
        enabled: yes
      when: inventory_hostname != 'localhost'

    - name: Ensure app user is in docker group
      user:
        name: "jenkins"
        groups: docker
        append: yes
      when: inventory_hostname != 'localhost'

    - name: Allow application port through firewall
      ufw:
        rule: allow
        port: "8090"
        proto: tcp
      when: inventory_hostname != 'localhost'

    - name: Display configuration summary
      debug:
        msg:
          - "Host: {{ inventory_hostname }}" 
          - "Application directory: /var/jenkins_home/petclinic"
          - "Application port: 8090"
          - "Application user: jenkins"